  <style>

    .band-tab{position:absolute;z-index:0;top:-61px;left:calc(var(--tab-left,16%) - 10px);width:clamp(122px,15vw,190px);height:clamp(32px,3.9vw,49px);display:grid;place-items:center;padding:0 10px;border:1.5px solid rgba(255,255,255,.96);border-bottom:0;border-radius:var(--tab-radius,10px 10px 0 0);appearance:none;cursor:pointer;color:var(--tab-ink,var(--ink));background-image:linear-gradient(var(--band),var(--band)),var(--texture,url("assets/img/carton-2.jpg"));background-size:100% 100%,170px 170px;background-blend-mode:color,normal;font-family:Anton,Impact,"Arial Narrow",sans-serif;font-size:clamp(12px,1.05vw,16px);font-weight:400;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:none;box-shadow:0 -3px 8px rgba(0,0,0,.1),inset 0 1px rgba(255,255,255,.35);transform:rotate(var(--tilt,0deg));transform-origin:bottom center}

    .stack:not(.has-open) .band-title{font-size:clamp(38px,7vh,144px);line-height:.82}

    #dividerStack .band-title,#dividerStack .band-tab,#dividerStack .video-role,#dividerStack .project-tab{text-shadow:none!important;filter:none!important}
    .band-index{position:absolute;z-index:2;right:clamp(16px,3vw,44px);bottom:8px;color:var(--title-ink,var(--ink));font:700 10px/1 "DM Sans",Arial,sans-serif;letter-spacing:.12em;opacity:.72;pointer-events:none}

    .band-slot.is-open .band-content{opacity:1;transform:none;pointer-events:auto}
    .band-slot.is-closing .band-content{opacity:1;transform:none;transition:none;pointer-events:none}
    .band-slot.is-closing .video-panel,.band-slot.is-closing .project-tabs,.band-slot.is-closing .band-close{opacity:0;transition:opacity .2s ease}
    .video-panel{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(100%,calc((100svh - 180px)*1.7778));max-height:100%;padding:clamp(8px,1.5vh,16px);border:1.5px solid #fff;border-radius:4px;background-image:linear-gradient(var(--band),var(--band)),var(--texture,url("assets/img/carton-2.jpg"));background-size:100% 100%,170px 170px;background-blend-mode:color,normal;box-shadow:0 14px 32px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.42);overflow:visible;opacity:0;transition:opacity .45s ease}
    .video-panel.is-visible{opacity:1}

    .video-role{position:absolute;z-index:4;left:clamp(28px,8vw,120px);bottom:0;max-width:min(70%,520px);margin:0;padding:clamp(10px,1.5vw,18px) clamp(18px,3vw,38px) clamp(13px,1.8vw,22px);border:1.5px solid #fff;border-radius:3px;background-image:linear-gradient(var(--band),var(--band)),var(--texture,url("assets/img/carton-2.jpg"));background-size:100% 100%,170px 170px;background-blend-mode:color,normal;color:var(--panel-ink,var(--ink));font-family:Anton,Impact,"Arial Narrow",sans-serif;font-size:clamp(20px,3.7vw,48px);line-height:1;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 22px rgba(0,0,0,.25);transform:translateY(50%) rotate(-8deg);pointer-events:none}
    .project-tabs{position:relative;z-index:1;flex:none;display:flex;align-items:flex-end;justify-content:center;gap:9px;max-width:100%;overflow:auto;scrollbar-width:none;margin-bottom:-11px;padding:0 4px}
    .project-tabs::-webkit-scrollbar{display:none}
    .project-tab{position:relative;flex:none;padding:10px 18px 14px;border:1.5px solid rgba(255,255,255,.96);border-bottom:0;border-radius:var(--tab-radius,9px 9px 0 0);background:rgba(255,255,255,.2);color:var(--ink);font-family:Anton,Impact,"Arial Narrow",sans-serif;font-size:clamp(12px,1.15vw,19px);font-weight:400;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transform:translateY(5px);transition:transform .18s ease,box-shadow .2s ease;box-shadow:inset 0 -7px 11px -7px rgba(0,0,0,.45),0 -2px 5px rgba(0,0,0,.1)}
    .project-tab:hover{transform:translateY(2px)}
    .project-tab[aria-selected="true"]{transform:translateY(0);box-shadow:0 -5px 12px rgba(0,0,0,.2)}
    .band-close{position:absolute;z-index:5;top:16px;right:18px;width:38px;height:38px;border:1.5px solid #fff;border-radius:50%;background:rgba(23,27,53,.78);color:#fff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:transform .2s ease,background .2s ease}
    .band-close:hover{transform:rotate(90deg);background:#171b35}
    .stack-note{position:fixed;z-index:10;right:18px;bottom:16px;padding:8px 11px;border:1px solid rgba(255,255,255,.78);border-radius:3px;background:rgba(250,250,247,.9);color:var(--ink);font:700 9px/1.2 "DM Sans",Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;pointer-events:none}
    .stack.has-open .stack-note{display:none}
    @media(max-width:860px){
      :root{--chrome:64px}
      .site-head{padding:0 14px}
      .head-nav{gap:12px}
      .head-nav a{font-size:10px}
      .head-status{display:none}
      .stack{min-height:0}
      .band-title{font-size:clamp(38px,6vh,100px)}
      .stack:not(.has-open) .band-title{font-size:clamp(32px,5.7vh,92px)}
      .band-tab{width:min(35vw,150px);height:30px;top:-52px;left:calc(var(--tab-left,16%) - 10px)}
      .band-index{font-size:8px;bottom:7px}
      .band-content{align-items:flex-start;justify-content:flex-start;overflow-x:hidden;overflow-y:auto;padding:50px 12px 18px;-webkit-overflow-scrolling:touch}
      .video-panel{width:min(100%,720px);max-height:none;padding:9px;gap:8px}
      .video-role{position:static;align-self:flex-start;max-width:100%;margin:2px 0 -7px;padding:9px 14px 11px;font-size:clamp(18px,5vw,30px);transform:rotate(-4deg)}
      .video-panel{overflow:visible}
      .band-close{position:fixed;top:74px;right:14px;width:36px;height:36px}
    }
    @media(max-width:520px){
      .wordmark{font-size:11px;gap:6px}.wordmark img{width:21px;height:21px}
      .head-nav{position:static;transform:none;margin-left:auto;margin-right:12px;gap:10px}
      .head-nav a{font-size:9px}
      .head-end{display:none}
      .stack{min-height:0}
      .band-title{font-size:clamp(34px,5.5vh,76px);letter-spacing:-.035em}
      .stack:not(.has-open) .band-title{font-size:clamp(30px,4.8vh,68px)}
      .band-sheet{left:-7px;right:-7px}
      .band-tab{left:calc(var(--tab-left,16%) - 7px)}
      .band-content{padding:50px 8px 12px}
      .band-close{top:72px;right:10px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>

        {label:'APPAREL PROMO',title:'Apparel Drop',kind:'Portrait · Brand reel',role:'BRAND PROMO',color:'#d94870',ink:'#ffe36b',align:'right',left:'52%',tilt:'.45deg',id:'1_kfG0LfsIJ-dUv9dy-PPpxQBcNICuu6n'},
        {label:'PRODUCT REEL',title:'Roopkala Facepack',kind:'Portrait · Product film',role:'PRODUCT FILM',color:'#c1b5a8',ink:'#671732',align:'left',left:'11%',tilt:'-.3deg',id:'1F5toKQssor8GndCdM4VOlaoqpx8MV5qN'}
      ];
      var stack=document.getElementById('dividerStack');
      var slots=[];
      var active=-1;
      var totalHeight=0;
      var textureFiles=['carton-1.jpg','carton-2.jpg','carton-3.jpg','carton-4.jpg'];
      var weights=[1.1,1.35,.8,1.2,.9,1.15,.85];
      var isMobile=function(){return window.matchMedia('(max-width: 860px)').matches};
      function frame(id,title){
        var iframe=document.createElement('iframe');
        iframe.src='https://drive.google.com/file/d/'+id+'/preview';
        iframe.title=title;
        iframe.loading='lazy';
        iframe.allow='autoplay; fullscreen; picture-in-picture';
        iframe.allowFullscreen=true;
        iframe.referrerPolicy='strict-origin-when-cross-origin';
        return iframe;
      }
      function cacheClosedTitleMetrics(slot){
        if(!slot||slot.titlePinned||!slot.title.isConnected)return;
        var rect=slot.title.getBoundingClientRect(),clipRect=slot.clip.getBoundingClientRect(),style=getComputedStyle(slot.title);
        slot.closedTitleMetrics={top:rect.top-clipRect.top,left:rect.left-clipRect.left,fontFamily:style.fontFamily,fontSize:style.fontSize,fontWeight:style.fontWeight,lineHeight:style.lineHeight,letterSpacing:style.letterSpacing,textTransform:style.textTransform,color:style.color};
      }
      function cacheAllClosedTitleMetrics(){if(active===-1)slots.forEach(cacheClosedTitleMetrics);}
      function pinTitle(slot){
        if(!slot||slot.titlePinned)return;

        var title=slot.title,metrics=slot.closedTitleMetrics;
        slot.titleOriginalStyle=title.getAttribute('style');
        slot.titlePinned=true;
        title.style.position='absolute';title.style.zIndex='1';title.style.top=metrics.top+'px';title.style.left=metrics.left+'px';title.style.right='auto';title.style.bottom='auto';
        title.style.display='inline-block';title.style.width='max-content';title.style.maxWidth='none';title.style.transform='none';title.style.margin='0';
        title.style.fontFamily=metrics.fontFamily;title.style.fontSize=metrics.fontSize;title.style.fontWeight=metrics.fontWeight;title.style.lineHeight=metrics.lineHeight;title.style.letterSpacing=metrics.letterSpacing;title.style.textTransform=metrics.textTransform;title.style.color=metrics.color;
        title.style.whiteSpace='nowrap';title.style.overflow='visible';title.style.textOverflow='clip';title.style.textShadow='none';title.style.transition='none';title.style.pointerEvents='none';
        slot.clip.appendChild(title);
      }
      function unpinTitle(slot){
        if(!slot||!slot.titlePinned)return;
        slot.button.insertBefore(slot.title,slot.index);
        if(slot.titleOriginalStyle===null)slot.title.removeAttribute('style');else slot.title.setAttribute('style',slot.titleOriginalStyle);
        slot.titlePinned=false;slot.titleOriginalStyle=null;
      }
      function scheduleWindowFade(slot,index){
        if(slot.frameFadeTimer){clearTimeout(slot.frameFadeTimer);slot.frameFadeTimer=0;}
        if(!slot.panel)return;
        slot.panel.classList.remove('is-visible');
        slot.frameFadeTimer=setTimeout(function(){
          slot.frameFadeTimer=0;
          if(active===index&&slot.el.classList.contains('is-open')&&slot.panel)slot.panel.classList.add('is-visible');

      }
      function clearSlotContent(slot){

        if(slot.frameFadeTimer){clearTimeout(slot.frameFadeTimer);slot.frameFadeTimer=0;}

      }
      function setOpen(index){
        var previous=active;

        active=next;
        stack.classList.toggle('has-open',active!==-1);
        measure();
        slots.forEach(function(slot,i){

          slot.el.style.zIndex=opened?String(videos.length+10):String(i+1);

            if(i===previous&&slot.content){

              slot.el.classList.add('is-closing');

            tabs=document.createElement('div');tabs.className='project-tabs';tabs.setAttribute('role','tablist');
            projects.forEach(function(project,j){
              var tab=document.createElement('button');tab.className='project-tab';tab.type='button';tab.textContent=project.name;tab.setAttribute('role','tab');tab.setAttribute('aria-selected',j===0?'true':'false');tab.style.setProperty('--tab-radius',slot.data.tabRadius||'10px 10px 0 0');tab.style.color=slot.data.ink;tab.style.backgroundImage='linear-gradient('+slot.data.color+','+slot.data.color+'),url("assets/img/'+textureFiles[i%textureFiles.length]+'")';tab.style.backgroundSize='100% 100%,170px 170px';tab.style.backgroundBlendMode='color,normal';
              tab.addEventListener('click',function(e){e.stopPropagation();tabs.querySelectorAll('.project-tab').forEach(function(other){other.setAttribute('aria-selected','false');});tab.setAttribute('aria-selected','true');player.replaceChildren(frame(project.id,slot.data.title+' — '+project.name));});
              tabs.appendChild(tab);
            });
          }
          var player=document.createElement('div');player.className='video-frame';player.appendChild(frame(projects[0].id,slot.data.title));panel.appendChild(player);
          var role=document.createElement('p');role.className='video-role';role.textContent=slot.data.role||slot.data.kind;panel.appendChild(role);
          if(tabs)content.append(tabs);content.append(panel);slot.clip.replaceChildren(slot.title,content,close);slot.content=content;slot.player=player;slot.panel=panel;slot.tabs=tabs;scheduleWindowFade(slot,i);
          requestAnimationFrame(function(){fitPlayer(slot);});
        });
        if(active!==-1&&isMobile())slots[active].el.scrollIntoView({behavior:'smooth',block:'end'});
      }
      var tabShapes=['10px 10px 0 0','4px 24px 0 0','24px 4px 0 0','16px 16px 0 0'];
      videos.forEach(function(data,i){
        var slot=document.createElement('article');slot.className='band-slot';
        var button=document.createElement('button');button.className='band-sheet';button.type='button';button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Open '+data.title+' video preview');
        button.style.setProperty('--band',data.color);button.style.setProperty('--title-ink',data.ink);button.style.setProperty('--tab-ink',data.ink);button.style.setProperty('--tab-left',data.left);button.style.setProperty('--tab-radius',tabShapes[i%tabShapes.length]);button.style.setProperty('--tilt',data.tilt);button.style.setProperty('--texture','url("assets/img/'+textureFiles[i%textureFiles.length]+'")');
        var tab=document.createElement('button');tab.className='band-tab';tab.type='button';tab.textContent=data.label;tab.setAttribute('aria-label','Open '+data.title+' video preview');tab.style.setProperty('--band',data.color);tab.style.setProperty('--title-ink',data.ink);tab.style.setProperty('--tab-ink',data.ink);tab.style.setProperty('--tab-left',data.left);tab.style.setProperty('--tab-radius',tabShapes[i%tabShapes.length]);tab.style.setProperty('--tilt',data.tilt);tab.style.setProperty('--texture','url("assets/img/'+textureFiles[i%textureFiles.length]+'")');tab.addEventListener('click',function(){setOpen(i);});
        var title=document.createElement('span');title.className='band-title '+(data.align==='right'?'right':'');title.textContent=data.title;
        var index=document.createElement('span');index.className='band-index';index.textContent=String(i+1).padStart(2,'0');
        button.append(title,index);
        var clip=document.createElement('div');clip.className='band-clip';
        button.addEventListener('click',function(){setOpen(i);});
        slot.append(button,tab,clip);stack.appendChild(slot);slots.push({el:slot,button:button,clip:clip,title:title,index:index,data:data,content:null,closeTimer:0,frameFadeTimer:0,titlePinned:false,titleOriginalStyle:null,closedTitleMetrics:null});
        slot.addEventListener('transitionend',function(event){if(event.target!==slot)return;if(slot.classList.contains('is-closing')&&active!==i)clearSlotContent(slots[i]);if(active===i)fitPlayer(slots[i]);});
      });
      requestAnimationFrame(cacheAllClosedTitleMetrics);
      if(document.fonts&&document.fonts.ready)document.fonts.ready.then(cacheAllClosedTitleMetrics);
      function fitPlayer(slot){
        if(!slot||!slot.player||!slot.panel||!slot.content)return;
        var frameEl=slot.player,panel=slot.panel,content=slot.content;
        var panelStyle=getComputedStyle(panel),contentStyle=getComputedStyle(content);
        var px=parseFloat(panelStyle.paddingLeft)+parseFloat(panelStyle.paddingRight)+parseFloat(panelStyle.borderLeftWidth)+parseFloat(panelStyle.borderRightWidth);
        var py=parseFloat(panelStyle.paddingTop)+parseFloat(panelStyle.paddingBottom)+parseFloat(panelStyle.borderTopWidth)+parseFloat(panelStyle.borderBottomWidth);
        if(isMobile()){
          var mobileW=Math.max(140,panel.clientWidth-px);
          frameEl.style.width=mobileW+'px';frameEl.style.height=(mobileW*9/16)+'px';
          return;
        }
        var reserved=(slot.tabs?slot.tabs.getBoundingClientRect().height-6:0)+py+34;
        var maxH=Math.max(90,slot.el.getBoundingClientRect().height-parseFloat(contentStyle.paddingTop)-parseFloat(contentStyle.paddingBottom)-reserved);
        var maxW=Math.max(160,Math.min(content.clientWidth-parseFloat(contentStyle.paddingLeft)-parseFloat(contentStyle.paddingRight)-px,window.innerWidth*.68));
        var w=Math.min(maxW,maxH*16/9);frameEl.style.width=w+'px';frameEl.style.height=(w*9/16)+'px';
        panel.style.width=(w+px)+'px';
      }
      function measure(){
        var available=Math.max(window.innerHeight-74-22,520);
        totalHeight=active!==-1?available:(videos.length<=10?available:available+(videos.length-10)*available/10);
        stack.style.height=totalHeight+'px';
        if(active!==-1){
          var closed=isMobile()?Math.max(10,Math.min(22,totalHeight*.12/(videos.length-1))):null;
          slots.forEach(function(slot,i){slot.el.style.flexGrow=i===active?(isMobile()?String(Math.max(1,totalHeight-(videos.length-1)*closed)):'80'):(isMobile()?String(closed):String(20/(videos.length-1)));slot.el.style.order=isMobile()?(i===active?'1':'0'):'';slot.el.style.zIndex=i===active?String(videos.length+10):String(i+1);});
        }else{slots.forEach(function(slot,i){slot.el.style.flexGrow=String(weights[i%weights.length]);slot.el.style.order='';slot.el.style.zIndex=String(i+1);});}
      }
      window.addEventListener('resize',function(){measure();if(active===-1)requestAnimationFrame(cacheAllClosedTitleMetrics);else requestAnimationFrame(function(){fitPlayer(slots[active]);});},{passive:true});
      document.addEventListener('keydown',function(e){if(e.key==='Escape'&&active!==-1)setOpen(active);});
      measure();
    })();
  </script>
</body>
